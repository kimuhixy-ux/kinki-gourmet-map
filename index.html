<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>近畿グルメマップ</title>
<meta name="description" content="近畿・中国・四国地方(15府県)の食事ができるお店を1枚の地図で探せるPWA">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b23a2f">

<!-- iOS向け -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="近畿グルメマップ">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map"></div>

<button id="locate-btn" title="現在地に移動" aria-label="現在地に移動">📍</button>

<div id="search-panel" class="hidden">
  <input type="text" id="search-input" placeholder="店名で検索…" autocomplete="off">
  <ul id="search-results"></ul>
</div>

<div id="category-panel" class="hidden">
  <div class="category-chips" id="category-chips"></div>
</div>

<div id="pref-panel" class="hidden">
  <div class="category-chips" id="pref-chips"></div>
</div>

<div id="filter-bar">
  <div class="filter-row" id="pref-filter">
    <button id="pref-toggle-btn" aria-label="都道府県">🗾 都道府県</button>
    <button id="category-toggle-btn" aria-label="ジャンル">🍽 ジャンル</button>
    <button id="search-toggle-btn" aria-label="検索">🔍</button>
  </div>
</div>

<!-- Leaflet JS -->
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>

<script src="js/app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.update();
    }).catch(console.error);
  });

  let refreshingAfterUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshingAfterUpdate) return;
    refreshingAfterUpdate = true;
    window.location.reload();
  });
}
</script>

</body>
</html>
